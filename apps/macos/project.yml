# XcodeGen spec. The .xcodeproj is generated (and gitignored): run `xcodegen` in apps/macos after pulling.
name: Mail
options:
  bundleIdPrefix: be.baree
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: DW92YAHZVK
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
packages:
  MailKit:
    path: MailKit
targets:
  Mail:
    type: application
    platform: macOS
    sources:
      - path: App
    # Custom keys only; everything standard comes from GENERATE_INFOPLIST_FILE.
    info:
      path: App/Resources/Info.plist
      properties:
        GoogleClientID: $(GOOGLE_CLIENT_ID)
        MicrosoftClientID: $(MICROSOFT_CLIENT_ID)
    dependencies:
      - package: MailKit
        product: DesignSystem
      - package: MailKit
        product: MailCore
      - package: MailKit
        product: Providers
    settings:
      base:
        PRODUCT_NAME: Baree Mail
        PRODUCT_MODULE_NAME: MailApp
        PRODUCT_BUNDLE_IDENTIFIER: be.baree.mail
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_ENTITLEMENTS: App/Resources/Mail.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Baree Mail
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Siebe Baree"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # OAuth client ids. Not secrets: both are public clients that use PKCE.
        # Google: an iOS-type client for bundle id be.baree.mail. Microsoft: a public client app registration with
        # redirect uri msauth.be.baree.mail://auth.
        GOOGLE_CLIENT_ID: "120617231468-9n56accj81imqh2a7638n8hsstlfad5e.apps.googleusercontent.com"
        MICROSOFT_CLIENT_ID: ""
schemes:
  Mail:
    build:
      targets:
        Mail: all
    run:
      config: Debug
    test:
      config: Debug
