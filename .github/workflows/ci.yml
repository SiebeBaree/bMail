name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    api:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - run: pnpm typecheck
            - run: pnpm lint
            - run: pnpm format:check
            - run: pnpm test

            # The Swift client is generated from this file; a contract change without regenerating it fails here.
            - name: OpenAPI document is up to date
              run: |
                  pnpm openapi
                  git diff --exit-code apps/macos/MailKit/Sources/APIClient/openapi.json

    macos:
        # Needs a runner with Xcode 27 (macOS 27 SDK).
        runs-on: macos-latest
        defaults:
            run:
                working-directory: apps/macos
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - run: brew install xcodegen

            - name: Test MailKit
              working-directory: apps/macos/MailKit
              run: swift test

            - name: Build the app
              run: |
                  xcodegen generate
                  xcodebuild -project Mail.xcodeproj -scheme Mail -configuration Debug \
                      -skipPackagePluginValidation -skipMacroValidation \
                      CODE_SIGNING_ALLOWED=NO build

            - name: Build the iPhone app
              working-directory: apps/ios
              run: |
                  xcodegen generate
                  xcodebuild -project Mail.xcodeproj -scheme Mail -configuration Debug \
                      -destination 'generic/platform=iOS Simulator' \
                      -skipPackagePluginValidation -skipMacroValidation \
                      CODE_SIGNING_ALLOWED=NO build
