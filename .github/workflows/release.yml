name: Release

# Push a tag like v0.2.0 to publish bMail 0.2.0: a signed, notarized DMG on a GitHub release, with the appcast.xml
# that installed copies read to update themselves. The api isn't part of this; Vercel deploys it from main.
on:
    push:
        tags: ["v*"]

permissions:
    contents: write

jobs:
    macos:
        # The app targets macOS 27, so it builds with Xcode 27.
        runs-on: xcode-27
        defaults:
            run:
                working-directory: apps/macos
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - run: brew install xcodegen

            - name: Version from the tag
              run: |
                  version="${GITHUB_REF_NAME#v}"
                  {
                      echo "VERSION=$version"
                      echo "DMG=$RUNNER_TEMP/bMail-$version.dmg"
                      echo "KEYCHAIN=$RUNNER_TEMP/signing.keychain-db"
                  } >> "$GITHUB_ENV"

            - name: Import the Developer ID certificate
              env:
                  CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
                  CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
              run: |
                  password="$(openssl rand -hex 24)"
                  security create-keychain -p "$password" "$KEYCHAIN"
                  security set-keychain-settings -lut 3600 "$KEYCHAIN"
                  security unlock-keychain -p "$password" "$KEYCHAIN"
                  echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
                  security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
                  rm "$RUNNER_TEMP/certificate.p12"
                  # Lets codesign use the key without a prompt nobody is there to answer.
                  security set-key-partition-list -S apple-tool:,apple: -k "$password" "$KEYCHAIN" > /dev/null
                  # The signature embeds the chain up to Apple's root. Both Developer ID intermediates, so a renewed
                  # certificate from the newer one works too.
                  for ca in DeveloperIDCA DeveloperIDG2CA; do
                      curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer"
                      security import "$RUNNER_TEMP/$ca.cer" -k "$KEYCHAIN"
                  done
                  security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

            # Signing happens below rather than in Xcode, which would otherwise want a team and profile for every
            # package target. The build number is what Sparkle compares, so it only ever goes up.
            - name: Build
              run: |
                  xcodegen generate
                  xcodebuild archive -project Mail.xcodeproj -scheme Mail -configuration Release \
                      -archivePath "$RUNNER_TEMP/bMail.xcarchive" \
                      -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" \
                      -skipPackagePluginValidation -skipMacroValidation \
                      MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
                      CODE_SIGNING_ALLOWED=NO

            - name: Sign and package
              env:
                  PROVISIONING_PROFILE: ${{ secrets.DEVELOPER_ID_PROVISIONING_PROFILE }}
                  TEAM_ID: DW92YAHZVK
              run: |
                  app="$RUNNER_TEMP/dmg/bMail.app"
                  mkdir "$RUNNER_TEMP/dmg"
                  ditto "$RUNNER_TEMP/bMail.xcarchive/Products/Applications/bMail.app" "$app"
                  entitlements="$RUNNER_TEMP/Mail.entitlements"
                  cp App/Resources/Mail.entitlements "$entitlements"
                  # iCloud Keychain needs keychain-access-groups, and macOS only lets an app with that entitlement launch
                  # when an embedded profile grants it. Without the profile secret, accounts stay on this Mac.
                  if [ -n "$PROVISIONING_PROFILE" ]; then
                      echo "$PROVISIONING_PROFILE" | base64 --decode > "$app/Contents/embedded.provisionprofile"
                      sed -i '' "s/[$](AppIdentifierPrefix)/$TEAM_ID./" "$entitlements"
                      /usr/libexec/PlistBuddy -c "Add :com.apple.application-identifier string $TEAM_ID.be.baree.mail" "$entitlements"
                      /usr/libexec/PlistBuddy -c "Add :com.apple.developer.team-identifier string $TEAM_ID" "$entitlements"
                  else
                      plutil -remove keychain-access-groups "$entitlements"
                  fi
                  sign() { codesign --force --options runtime --timestamp --keychain "$KEYCHAIN" --sign "Developer ID Application" "$@"; }
                  # Inside out: Sparkle's helpers, Sparkle, then the app.
                  sparkle="$app/Contents/Frameworks/Sparkle.framework"
                  for helper in XPCServices/Installer.xpc XPCServices/Downloader.xpc Autoupdate Updater.app; do
                      sign "$sparkle/Versions/B/$helper"
                  done
                  sign "$sparkle"
                  sign --entitlements "$entitlements" "$app"
                  codesign --verify --deep --strict "$app"
                  ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
                  diskutil image create from --format ULFO --volumeName bMail "$RUNNER_TEMP/dmg" "$DMG"
                  codesign --timestamp --keychain "$KEYCHAIN" --sign "Developer ID Application" "$DMG"

            - name: Notarize
              env:
                  API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
                  API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
                  API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
              run: |
                  echo "$API_KEY" > "$RUNNER_TEMP/api-key.p8"
                  credentials=(--key "$RUNNER_TEMP/api-key.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID")
                  result="$(xcrun notarytool submit "$DMG" "${credentials[@]}" --wait --output-format json)"
                  echo "$result"
                  if [ "$(echo "$result" | jq -r .status)" != "Accepted" ]; then
                      xcrun notarytool log "$(echo "$result" | jq -r .id)" "${credentials[@]}"
                      exit 1
                  fi
                  xcrun stapler staple "$DMG"

            # Installed copies read releases/latest/download/appcast.xml, so each release carries one that points at its
            # own DMG. Sparkle refuses a DMG whose EdDSA signature doesn't match SUPublicEDKey, so this signs the final,
            # stapled file. The key is required: a release without an appcast would leave every copy on the old one.
            - name: Appcast
              env:
                  SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
              run: |
                  signature="$(echo "$SPARKLE_PRIVATE_KEY" | "$RUNNER_TEMP/packages/artifacts/sparkle/Sparkle/bin/sign_update" --ed-key-file - "$DMG")"
                  info="$RUNNER_TEMP/bMail.xcarchive/Products/Applications/bMail.app/Contents/Info.plist"
                  cat > "$RUNNER_TEMP/appcast.xml" <<EOF
                  <?xml version="1.0" encoding="utf-8"?>
                  <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
                      <channel>
                          <title>bMail</title>
                          <item>
                              <title>bMail $VERSION</title>
                              <pubDate>$(LC_ALL=C date -u "+%a, %d %b %Y %H:%M:%S +0000")</pubDate>
                              <sparkle:version>$GITHUB_RUN_NUMBER</sparkle:version>
                              <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                              <sparkle:minimumSystemVersion>$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$info")</sparkle:minimumSystemVersion>
                              <sparkle:fullReleaseNotesLink>https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME</sparkle:fullReleaseNotesLink>
                              <enclosure url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/bMail-$VERSION.dmg" type="application/octet-stream" $signature />
                          </item>
                      </channel>
                  </rss>
                  EOF
                  cat "$RUNNER_TEMP/appcast.xml"

            - name: Publish
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "$GITHUB_REF_NAME" "$DMG" "$RUNNER_TEMP/appcast.xml" \
                      --verify-tag --title "bMail $VERSION" --generate-notes

            - name: Remove the signing keychain
              if: always()
              run: security delete-keychain "$KEYCHAIN" || true
