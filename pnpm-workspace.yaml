packages:
    - "apps/*"
    - "packages/*"
catalog:
    typescript: ^7.0.2
    vitest: ^5.0.5
    zod: ^4.6.7
    drizzle-orm: ^0.45.4
allowBuilds:
    esbuild: true
# Upstream pins these exactly, so a patched release can only reach them through an override.
overrides:
    "@vercel/cli-config>zod": "catalog:"
    "@esbuild-kit/core-utils>esbuild": ^0.25.0
